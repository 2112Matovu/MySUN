# Reverse proxy for the MySun API. TLS is NOT configured here — put this
# behind a TLS-terminating layer (e.g. certbot + a second server block, or
# a managed load balancer) before exposing it publicly.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
