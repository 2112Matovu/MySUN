name: mysun_app
description: "MySun — Soroti University Campus Companion App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking (activated when the backend is wired in)
  dio: ^5.7.0

  # Google Sign-In (exchanged server-side for a Supabase session)
  google_sign_in: ^6.2.2

  # Local storage
  shared_preferences: ^2.3.3

  # Opens the phone dialer for the Call buttons
  url_launcher: ^6.3.1

  # Adds events to the device calendar
  add_2_calendar: ^3.0.1

  # Formatting
  intl: ^0.19.0
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
