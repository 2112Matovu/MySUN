name: mysun_app
description: "MySun — Soroti University Campus Companion App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking (activated when the backend is wired in)
  dio: ^5.7.0

  # Google Sign-In (exchanged server-side for a Supabase session)
  google_sign_in: ^6.2.2

  # Local storage
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.19.0
  image_picker: ^1.2.3
  http_parser: ^4.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
